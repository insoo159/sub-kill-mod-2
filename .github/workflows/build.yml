name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 安裝 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 讓 gradlew 可以執行
        run: chmod +x gradlew

      - name: 用 Gradle 建置
        run: ./gradlew build

      - name: 上傳建置好的 jar
        uses: actions/upload-artifact@v4
        with:
          name: subkill-mod
          path: build/libs/*.jar
